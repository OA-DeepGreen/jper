<div class="box box--padding-large box--brd-mgreyblue">
    <h3>Notification retention period settings</h3>
    <p>How many months can a notification be retained, after which they would get deleted.</p>
    <p>A value of 0 indicates they will not get deleted.</p>
    <form method="post" action="{{request.path}}/retentioninfo" class="form">
        <input type="hidden" name="retention_form" value="True">
        <ul class="form-fields">
            <li class="form-fields__item--text">

                    <span class="form-fields__label-text">for failed notifications</span>
                    <input type="text" name="retention_failed" class="form-control" placeholder="0"
                           value="{{account.data.get('notification_retention_period',{}).get('failed',0)}}">

            </li>
            <li class="form-fields__item--text">

                    <span class="form-fields__label-text">for routed notifications/span>
                    <input type="text" name="retention_routed" class="form-control"
                           value="{{account.data.get('notification_retention_period',{}).get('routed',0)}}">

            </li>
            <li class="form-fields__item--text">

                    <span class="form-fields__label-text">for errored notifications</span>
                    <input type="text" name="retention_errored" class="form-control"
                           value="{{account.data.get('notification_retention_period',{}).get('errored','')}}">

            </li>
        </ul>

        <button class="btn btn--3d" id="update_retention_preiod" type="submit">Update retention period</button>

    </form>
</div>
